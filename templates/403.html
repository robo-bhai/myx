<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Forbidden</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: #dc3545;
        }
        .error-message {
            font-size: 1.5rem;
            color: #6c757d;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

<div class="error-container">
    <div class="error-code">403</div>
    <h1 class="h3 mb-3">Access Forbidden</h1>
    <p class="error-message">
        Sorry, you don't have permission to access this page. This area is restricted to administrators only.
    </p>
    <div class="d-grid gap-2">
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-secondary">Log in as a different user</a>
    </div>
</div>

</body>
</html>
