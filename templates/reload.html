<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanelProMax | Reconnecting</title>
    <meta http-equiv="refresh" content="1">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanner { animation: scan 2s linear infinite; }
    </style>
</head>
<body class="bg-[#0f172a] text-white flex items-center justify-center min-h-screen font-sans">
    <div class="relative p-10 bg-slate-800/40 rounded-3xl shadow-2xl border border-yellow-500/20 backdrop-blur-md max-w-sm w-full overflow-hidden">
        <div class="absolute inset-0 scanner bg-gradient-to-b from-transparent via-yellow-500/10 to-transparent h-1/2 w-full opacity-30"></div>

        <div class="relative z-10 text-center">
            <div class="mb-6 relative inline-block">
                <div class="w-20 h-20 border-4 border-yellow-500/20 rounded-full flex items-center justify-center">
                    <span class="text-4xl animate-bounce">⚡</span>
                </div>
                <div class="absolute -top-1 -right-1 flex h-5 w-5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-5 w-5 bg-yellow-500"></span>
                </div>
            </div>

            <h1 class="text-3xl font-black text-yellow-500 mb-2 tracking-tight">UPGRADING</h1>
            <p class="text-slate-400 text-sm mb-8 leading-relaxed">
                Our servers are performing a high-speed sync. <br>
                <span class="text-yellow-500/80">Sit tight, we'll be back in a pulse.</span>
            </p>

            <div class="flex flex-col gap-3">
                <div class="h-1.5 w-full bg-slate-700 rounded-full overflow-hidden">
                    <div class="h-full bg-yellow-500 animate-[pulse_1.5s_infinite] w-3/4"></div>
                </div>
                <p class="text-[10px] font-mono text-slate-500 uppercase tracking-[0.2em]">
                    Auto-Refreshing Connection
                </p>
            </div>
        </div>
    </div>
</body>
</html>
