<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2>Edit User - {{ user.username }}</h2>
    <form method="POST" class="mt-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" value="{{ user.name }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" value="{{ user.username }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" value="{{ user.email }}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Balance (PKR)</label>
            <input type="number" step="0.01" name="balance" value="{{ user.balance }}" class="form-control" required>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="is_admin" id="adminCheck" {% if user.is_admin %}checked{% endif %}>
            <label class="form-check-label" for="adminCheck">Is Admin</label>
        </div>
        <button type="submit" class="btn btn-success">Update User</button>
        <a href="{{ url_for('admin_users') }}" class="btn btn-secondary">Back</a>
    </form>
</div>
</body>
</html>
