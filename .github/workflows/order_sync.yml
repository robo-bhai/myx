name: Sync SMM Orders Status

on:
  # Sirf manual trigger support karega
  workflow_dispatch:

jobs:
  sync-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install All Required Hardcoded Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flask Flask-SQLAlchemy Flask-Login Flask-Talisman Flask-WTF requests PyMySQL cryptography python-dotenv werkzeug xlsxwriter pywebpush
      

    - name: Install Hardcoded Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-sqlalchemy flask-login flask-wtf flask-talisman \
                    flask-limiter requests python-dotenv pymysql cryptography \
                    xlsxwriter pywebpush urllib3 werkzeug gunicorn Authlib
      - name: Execute Order Sync Script
        env:
          # Pass required secrets to Python environment
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_ACCESS_KEY: ${{ secrets.ADMIN_ACCESS_KEY }}
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          HADI_PATH: ${{ secrets.HADI_PATH }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
        run: python sync_orders.py
