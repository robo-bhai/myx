name: Sync SMM Orders Status

on:
  # Sirf manual trigger support karega
  workflow_dispatch:

jobs:
  sync-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install All Hardcoded Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flask Flask-SQLAlchemy Flask-Login Flask-WTF Flask-Talisman \
                      Flask-Limiter requests python-dotenv PyMySQL cryptography \
                      xlsxwriter pywebpush urllib3 werkzeug gunicorn Authlib

      - name: Execute Order Sync Script
        env:
          # Application Secrets
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
          ADMIN_ACCESS_KEY: ${{ secrets.ADMIN_ACCESS_KEY }}
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          HADI_PATH: ${{ secrets.HADI_PATH }}
          BASE_URL: ${{ secrets.BASE_URL }}
          
          # Custom API Secrets (app.py expects Service_w with exact casing)
          SERVICE_ENC: ${{ secrets.SERVICE_ENC }}
          service_enc: ${{ secrets.SERVICE_ENC }}
          SERVICE_W: ${{ secrets.SERVICE_W }}
          Service_w: ${{ secrets.SERVICE_W }}
          service_w: ${{ secrets.SERVICE_W }}
          API_KEY: ${{ secrets.SERVICE_ENC }}
          API_URL: ${{ secrets.SERVICE_W }}
          
          # Database Secrets Mapping
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          MYSQL_HOST: ${{ secrets.DB_HOST }}
          MYSQL_USER: ${{ secrets.DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DB: ${{ secrets.DB_NAME }}
          MYSQL_PORT: ${{ secrets.DB_PORT }}
        run: python sync_orders.py
