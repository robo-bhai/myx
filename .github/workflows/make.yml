name: Make User Admin

on:
  workflow_dispatch: # Iss se aap GitHub web UI se manually run kar sakeinge

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Admin Script
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }} # Agar aap env secrets use kar rahe hain
      run: |
        python make_admin.py
