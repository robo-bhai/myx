name: Flask App & MySQL Database Integration Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# GitHub API se active workflows cancel karne ke liye required permissions
permissions:
  actions: write
  contents: read

concurrency:
  group: global-runner-lock
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      wallet_topic: ${{ secrets.WALLET_TOPIC }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      HADI_PATH: ${{ secrets.HADI_PATH }}
      ADMIN_ACCESS_KEY: ${{ secrets.ADMIN_ACCESS_KEY }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      MYSQL_USER: ${{ secrets.DB_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_HOST: ${{ secrets.DB_HOST }}
      MYSQL_PORT: ${{ secrets.DB_PORT }}
      MYSQL_DB: ${{ secrets.DB_NAME }}
      SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
      FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
      SERVICE_ENC: ${{ secrets.SERVICE_ENC }}
      Service_w: ${{ secrets.SERVICE_W }}
      EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}

      FLASK_ENV: production

    steps:
    - name: Cancel ALL Active Runs in Repository
      uses: styfle/cancel-workflow-action@0.12.1
      with:
        access_token: ${{ secrets.GITHUB_TOKEN }}
        all_but_latest: true

    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Hardcoded Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-sqlalchemy flask-login flask-wtf flask-talisman \
                    flask-limiter requests python-dotenv pymysql cryptography \
                    xlsxwriter pywebpush urllib3 werkzeug gunicorn Authlib

    - name: Install Cloudflared
      run: |
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb

    - name: Test MySQL Connection & Table Creation
      run: |
        python -c "
        import os
        from app import app, db, initialize_database
        from sqlalchemy import inspect

        with app.app_context():
            print('Testing MySQL connection and initializing database...')
            initialize_database()
            
            inspector = inspect(db.engine)
            tables = inspector.get_table_names()
            print('Successfully created tables in MySQL:', tables)
            
            assert len(tables) > 0, 'No tables were created!'
            print('✅ Database connection & table creation test passed!')
        "

    - name: Test App Startup & Basic Route Response
      run: |
        python -c "
        from app import app

        with app.test_client() as client:
            print('Testing App Home Route...')
            response = client.get('/')
            print('HTTP Response Status Code:', response.status_code)
            
            assert response.status_code in [200, 302], f'App startup failed with status {response.status_code}'
            print('✅ App started successfully and handled route request!')
        "

    - name: Start App & Expose via Static Cloudflare Tunnel
      run: |
        echo "Starting Gunicorn server (5 Workers, 2 Threads)..."
        nohup gunicorn --workers 5 --threads 2 --timeout 120 --bind 127.0.0.1:5000 app:app > gunicorn.log 2>&1 &

        sleep 3
        
        # Health check to ensure Gunicorn started properly
        if ! curl -s http://127.0.0.1:5000/ > /dev/null; then
          echo "❌ Gunicorn failed to start! Displaying logs:"
          cat gunicorn.log
          exit 1
        fi
        echo "✅ Gunicorn is running healthily on local port 5000!"

        echo "Starting Persistent Cloudflare Tunnel..."
        nohup cloudflared tunnel run --token "$CLOUDFLARE_TUNNEL_TOKEN" > cloudflare.log 2>&1 &
        
        sleep 5
        
        echo "=================================================="
        echo "   APP IS LIVE ON YOUR STATIC CLOUDFLARE DOMAIN   "
        echo "=================================================="
        
        echo "Holding runner open safely for 17,000 seconds (~4.7 hours)..."
        sleep 17000
        echo "Timer expired. Workflow completing gracefully."
