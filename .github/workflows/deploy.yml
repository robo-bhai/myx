name: Flask App & Local MySQL Sync Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: global-runner-lock
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local_root_pass
          MYSQL_DATABASE: local_app_db
          MYSQL_USER: local_user
          MYSQL_PASSWORD: local_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      wallet_topic: ${{ secrets.WALLET_TOPIC }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      HADI_PATH: ${{ secrets.HADI_PATH }}
      ADMIN_ACCESS_KEY: ${{ secrets.ADMIN_ACCESS_KEY }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      MYSQL_USER: ${{ secrets.DB_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_HOST: ${{ secrets.DB_HOST }}
      MYSQL_PORT: ${{ secrets.DB_PORT }}
      MYSQL_DB: ${{ secrets.DB_NAME }}
      SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
      FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
      SERVICE_ENC: ${{ secrets.SERVICE_ENC }}
      Service_w: ${{ secrets.SERVICE_W }}
      EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}

      FLASK_ENV: production

    steps:
    - name: Cancel ALL Active Runs in Repository
      uses: styfle/cancel-workflow-action@0.12.1
      with:
        access_token: ${{ secrets.GITHUB_TOKEN }}
        all_but_latest: true

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install System Dependencies & MySQL Client
      run: |
        sudo apt-get update
        sudo apt-get install -y mysql-client

    - name: Cache Cloudflared Binary
      id: cache-cloudflared
      uses: actions/cache@v4
      with:
        path: /usr/local/bin/cloudflared
        key: cloudflared-binary-v1

    - name: Install Cloudflared Tunnel (If not Cached)
      if: steps.cache-cloudflared.outputs.cache-hit != 'true'
      run: |
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb
        sudo cp /usr/bin/cloudflared /usr/local/bin/cloudflared

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-sqlalchemy flask-login flask-wtf flask-talisman \
                    flask-limiter requests python-dotenv pymysql cryptography \
                    xlsxwriter pywebpush urllib3 werkzeug gunicorn Authlib

    - name: Restore Local DB Cache
      id: db-cache
      uses: actions/cache/restore@v4
      with:
        path: db_cache/
        key: mysql-db-latest-cache-
        restore-keys: |
          mysql-db-latest-cache-

    - name: Process DB Dump (Cache Check, Load & Fresh Cloud Fallback)
      run: |
        LOAD_SUCCESS=false

        # Step A: Cache Check & Load
        if [ -f "db_cache/db-dump.sql" ] && [ -s "db_cache/db-dump.sql" ]; then
          echo "⚡ Found cached database dump! Testing SQL file integrity..."
          
          if grep -qi -E "Table structure|INSERT INTO|CREATE TABLE" db_cache/db-dump.sql; then
            echo "✅ Cached dump is valid! Restoring database state into Local MySQL..."
            if mysql -h 127.0.0.1 -P 3306 -u local_user -plocal_password local_app_db < db_cache/db-dump.sql; then
              echo "✅ Local MySQL restored successfully from Local Cache!"
              LOAD_SUCCESS=true
            else
              echo "⚠️ MySQL failed to import cached file. File might be corrupted."
            fi
          else
            echo "❌ Cached SQL file failed integrity check (file corrupt or empty)."
          fi
        else
          echo "ℹ️ No local cache file found (First run or Cache Expired)."
        fi

        # Step B: Fresh Install Fallback (Cloud MySQL Fetch)
        if [ "$LOAD_SUCCESS" = "false" ]; then
          echo "📥 Performing FRESH INSTALL: Fetching fresh database dump from Cloud MySQL..."
          mysqldump -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" \
            --set-gtid-purged=OFF \
            --no-tablespaces \
            --single-transaction \
            --quick \
            --lock-tables=false \
            "$MYSQL_DB" > raw_cloud_dump.sql

          echo "🧹 Cleaning DEFINER & GTID queries..."
          sed -E 's/DEFINER=`[^`]+`@`[^`]+`/DEFINER=CURRENT_USER/g' raw_cloud_dump.sql | \
          sed -E 's/@@GLOBAL\.GTID_PURGED=/\-- @@GLOBAL\.GTID_PURGED=/g' > cloud_dump.sql

          echo "📦 Loading fresh database state into Local MySQL..."
          mysql -h 127.0.0.1 -P 3306 -u local_user -plocal_password local_app_db < cloud_dump.sql
          echo "✅ Fresh DB successfully initialized from Cloud MySQL!"
        fi

    - name: Verify Local MySQL Database Connection
      env:
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: 3306
        MYSQL_USER: local_user
        MYSQL_PASSWORD: local_password
        MYSQL_DB: local_app_db
      run: |
        python -c "
        import os
        from app import app, db
        from sqlalchemy import inspect

        with app.app_context():
            print('Testing Local Database Connection...')
            inspector = inspect(db.engine)
            tables = inspector.get_table_names()
            print('Tables available locally:', tables)
            assert len(tables) > 0, 'No tables found in Local MySQL!'
            print('✅ Connection & Data Integrity Passed!')
        "

    - name: Start Gunicorn App Server
      run: |
        echo "Starting Gunicorn server connected to local database..."
        MYSQL_HOST=127.0.0.1 MYSQL_PORT=3306 MYSQL_USER=local_user MYSQL_PASSWORD=local_password MYSQL_DB=local_app_db \
        nohup gunicorn --workers 5 --threads 2 --timeout 120 --bind 127.0.0.1:5000 app:app > gunicorn.log 2>&1 &
        
        sleep 3

        if ! curl -s http://127.0.0.1:5000/ > /dev/null; then
          echo "❌ Gunicorn startup failed!"
          cat gunicorn.log
          exit 1
        fi
        echo "✅ Gunicorn running healthily on http://127.0.0.1:5000"

    - name: Start Cloudflare Tunnel & Keep Alive
      run: |
        echo "Starting Cloudflare Tunnel..."
        nohup cloudflared tunnel run --token "$CLOUDFLARE_TUNNEL_TOKEN" > cloudflare.log 2>&1 &
        sleep 5

        echo "=================================================="
        echo "   APP IS LIVE ON LOCAL DB & EXPOSED VIA TUNNEL   "
        echo "=================================================="

        echo "Holding runner open safely for 17,000 seconds..."
        sleep 17000

    - name: Auto-Sync Local DB Back to Cloud DB (Failsafe)
      if: always()
      run: |
        echo "⚠️ Workflow stopping/canceled. Syncing latest Local DB state back to Cloud..."
        mkdir -p db_cache
        
        mysqldump -h 127.0.0.1 -P 3306 -u local_user -plocal_password local_app_db \
          --set-gtid-purged=OFF \
          --no-tablespaces \
          --single-transaction \
          --quick \
          --lock-tables=false > db_cache/raw_local_sync.sql
        
        sed -E 's/DEFINER=`[^`]+`@`[^`]+`/DEFINER=CURRENT_USER/g' db_cache/raw_local_sync.sql > db_cache/db-dump.sql

        echo "☁️ Uploading updated state to Cloud DB ($MYSQL_HOST)..."
        mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DB" < db_cache/db-dump.sql
        echo "✅ Synchronization back to Cloud DB completed successfully!"

    - name: Save Updated DB Dump to GitHub Cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: db_cache/
        key: mysql-db-latest-cache-${{ github.run_id }}-${{ github.run_attempt }}
