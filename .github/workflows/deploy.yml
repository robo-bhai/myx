name: Flask App & MySQL Database Integration Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Job-level global environments for all steps
    env:
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      MYSQL_USER: avnadmin
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_HOST: mysql-for-panel-hadi88-support.f.aivencloud.com
      MYSQL_PORT: 13461
      MYSQL_DB: defaultdb
      SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
      FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
      GODOFPANEL_API_KEY: ${{ secrets.GODOFPANEL_API_KEY }}
      GODOFPANEL_API_URL: ${{ secrets.GODOFPANEL_API_URL }}
      EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      FLASK_ENV: production

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Hardcoded Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-sqlalchemy flask-login flask-wtf flask-talisman \
                    flask-limiter requests python-dotenv pymysql cryptography \
                    xlsxwriter pywebpush urllib3 werkzeug gunicorn

    - name: Install Cloudflared
      run: |
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb

    - name: Test MySQL Connection & Table Creation
      run: |
        python -c "
        import os
        from app import app, db, initialize_database
        from sqlalchemy import inspect

        with app.app_context():
            print('Testing MySQL connection and initializing database...')
            initialize_database()
            
            inspector = inspect(db.engine)
            tables = inspector.get_table_names()
            print('Successfully created tables in MySQL:', tables)
            
            assert len(tables) > 0, 'No tables were created!'
            print('✅ Database connection & table creation test passed!')
        "

    - name: Test App Startup & Basic Route Response
      run: |
        python -c "
        from app import app

        with app.test_client() as client:
            print('Testing App Home Route...')
            response = client.get('/')
            print('HTTP Response Status Code:', response.status_code)
            
            assert response.status_code in [200, 302], f'App startup failed with status {response.status_code}'
            print('✅ App started successfully and handled route request!')
        "

    - name: Start App & Expose via Static Cloudflare Tunnel (10 Mins Hold)
      run: |
        echo "Starting Gunicorn server on port 5000..."
        gunicorn --bind 127.0.0.1:5000 app:app &
        
        sleep 3
        
        echo "Starting Persistent Cloudflare Tunnel..."
        cloudflared tunnel run --token $CLOUDFLARE_TUNNEL_TOKEN > cloudflare.log 2>&1 &
        
        sleep 5
        
        echo "=================================================="
        echo "   APP IS LIVE ON YOUR STATIC CLOUDFLARE DOMAIN   "
        echo "=================================================="
        
        echo "Holding runner open for 5 minutes (600 seconds) for manual testing..."
        sleep 20000
        echo "10 minutes timer expired. Workflow completing."
